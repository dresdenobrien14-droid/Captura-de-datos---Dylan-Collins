<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Captura de Datos</title>
</head>
<body>

  <h2>Captura de Datos</h2>

  <form id="formulario" action="https://script.google.com/macros/s/AKfycbzZzX12VKt476-xWQnX0e7KS3RLJkwgeI7yZ113qitaSK6g9iEWCvCmTUZZW2eSWyja/exec" method="POST" target="hidden_iframe" onsubmit="enviado()">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="numerodedia">Número de Día:</label><br>
    <input type="number" id="numerodedia" name="Numerodedia" required min="1"><br><br>

    <label for="valordeldolar">Valor del Dólar:</label><br>
    <input type="number" id="valordeldolar" name="ValordelDolar" required step="0.01" min="0"><br><br>

    <button type="submit" id="btnEnviar">Enviar</button>
  </form>

  <p id="estado"></p>

  <!-- Solo necesitamos un iframe oculto -->
  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    function enviado() {
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando...';
      
      setTimeout(function() {
        document.getElementById('estado').textContent = '¡Registro guardado con éxito!';
        document.getElementById('formulario').reset();
        document.getElementById('btnEnviar').disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
